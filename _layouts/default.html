<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  {% if page.sitemap == false %}
  <meta name="robots" content="noindex, nofollow">
  {% endif %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ site.subscribe_rss | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <meta name="theme-color" content="#08111f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef6ff" media="(prefers-color-scheme: light)">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>
  <div class="app-shell">
    {% include profile-card.html %}
    <main class="content-shell">
      <div class="content-shell__inner">
        {{ content }}
      </div>
    </main>
  </div>
  <script type="module" src="{{ '/assets/js/three-background.js' | relative_url }}"></script>
</body>
</html>
