<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines }}{% else %}{{ site.description }}{% endif %}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>
  <div class="app-shell">
    {% include profile-card.html %}
    <main class="content-shell">
      <div class="content-shell__inner">
        {{ content }}
      </div>
    </main>
  </div>
  <script type="module" src="{{ '/assets/js/three-background.js' | relative_url }}"></script>
</body>
</html>
