name: Pages check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter

      - name: Check generated entry points
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/assets/css/site.css
          test -s _site/assets/js/three-background.js
