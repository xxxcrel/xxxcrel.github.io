name: Pages check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter

      - name: Check interactions
        run: node --test _tests/*.test.cjs

      - name: Check generated entry points
        run: |
          test -s _site/index.html
          test -s _site/404.html
          test -s _site/assets/css/site.css
          test -s _site/assets/images/cheese-mark.svg
          test -s _site/assets/js/theme.js
          test -s _site/assets/js/code-copy.js
          test -s _site/assets/js/tree-particles.js
          test -s _site/assets/js/card-spotlight.js
          test -s _site/assets/js/header.js
          test -s _site/assets/js/ambient-grid.js
