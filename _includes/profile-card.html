<header class="terminal-header" data-site-header>
  <div class="terminal-header__row">
    <a class="terminal-logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页">
      <span class="terminal-logo__prompt" aria-hidden="true"><img src="{{ '/assets/images/black-hole-mark.svg' | relative_url }}" alt="" width="38" height="38"></span>
      <span class="terminal-logo__text">{{ site.title }}</span>
      <span class="terminal-logo__badge">BLOG</span>
    </a>
    <div class="terminal-header__tools">
      <div class="theme-picker" role="group" aria-label="主题模式">
        <button class="theme-picker__option" type="button" data-theme-option="dark" aria-label="深色主题" aria-pressed="false" title="深色主题"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 15.2A8.6 8.6 0 0 1 8.8 3.6 8.6 8.6 0 1 0 20.4 15.2Z"/></svg></button>
        <button class="theme-picker__option" type="button" data-theme-option="system" aria-label="跟随系统主题" aria-pressed="false" title="跟随系统"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button>
        <button class="theme-picker__option" type="button" data-theme-option="light" aria-label="浅色主题" aria-pressed="false" title="浅色主题"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
      </div>
      <a class="github-link" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.162 19.487c.5.09.682-.217.682-.483 0-.237-.009-.866-.014-1.7-2.782.605-3.369-1.34-3.369-1.34-.455-1.157-1.11-1.466-1.11-1.466-.908-.62.069-.607.069-.607 1.004.07 1.532 1.03 1.532 1.03.892 1.53 2.341 1.088 2.91.832.09-.647.35-1.088.636-1.339-2.221-.253-4.555-1.11-4.555-4.944 0-1.091.39-1.984 1.03-2.683-.104-.253-.447-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.835c.85.004 1.705.115 2.504.338 1.909-1.294 2.747-1.025 2.747-1.025.547 1.377.203 2.394.1 2.647.641.699 1.028 1.592 1.028 2.683 0 3.844-2.337 4.688-4.565 4.936.359.31.679.922.679 1.858 0 1.342-.012 2.423-.012 2.752 0 .269.18.577.688.48A10.003 10.003 0 0 0 12 2Z"/></svg>
      </a>
    </div>
  </div>
  <nav class="terminal-nav" aria-label="主导航">
    {% for nav in site.navs %}
    <a class="terminal-nav__item{% if page.url == nav.href %} is-active{% endif %}" href="{{ nav.href | relative_url }}"{% if page.url == nav.href %} aria-current="page"{% endif %}>{{ nav.label }}</a>
    {% endfor %}
  </nav>
</header>
